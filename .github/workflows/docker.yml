name: Docker Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -t saran0k/node-docker-api:latest .

      - name: Push Docker image
        run: docker push saran0k/node-docker-api:latest

      - name: Prepare SSH key
        env:
          EC2_PRIVATE_KEY_B64: ${{ secrets.EC2_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          echo "SSH key file created."

          ssh-keygen -y -f ~/.ssh/ec2_key.pem > /tmp/public_key.pub

          echo "SSH private key can be read successfully."

      - name: Test EC2 SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "Testing SSH connection..."

          ssh -vvv \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/ec2_key.pem \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo SSH_CONNECTION_SUCCESS"